<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seminar paper sign-up</title>
    <style>
      body { margin: 0; font-family: Arial, sans-serif; background: #f8fafc; color: #0f172a; }
      .wrap { max-width: 1100px; margin: 0 auto; padding: 24px; }
      .top { display: grid; grid-template-columns: 1.5fr 1fr; gap: 16px; margin-bottom: 16px; }
      .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 20px; }
      .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .stat { border: 1px solid #e2e8f0; border-radius: 14px; padding: 16px; }
      .label { font-size: 13px; color: #64748b; }
      .value { font-size: 32px; font-weight: 700; }
      h1,h2,h3,p { margin: 0; }
      h1 { font-size: 32px; margin-bottom: 16px; }
      h2 { font-size: 22px; margin-bottom: 16px; }
      h3 { font-size: 24px; margin-bottom: 16px; }
      .field { margin-bottom: 12px; }
      .field label { display: block; font-size: 14px; margin-bottom: 6px; }
      .field input { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #cbd5e1; box-sizing: border-box; }
      .status { margin-bottom: 16px; }
      .papers { display: grid; gap: 12px; }
      .paper { border: 1px solid #e2e8f0; border-radius: 14px; padding: 16px; display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: start; }
      .badges { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
      .pill { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; border: 1px solid #d1d5db; background: #fff; }
      .pill.available { background: #dcfce7; }
      .pill.taken { background: #e5e7eb; }
      .paper-title { font-size: 20px; font-weight: 600; line-height: 1.35; margin-bottom: 6px; }
      .citation { font-size: 14px; color: #475569; margin-bottom: 8px; }
      .linkrow { margin-bottom: 10px; }
      a { color: #1d4ed8; }
      button { padding: 10px 14px; border-radius: 12px; border: 1px solid #cbd5e1; background: #0f172a; color: white; cursor: pointer; font-weight: 600; }
      button:disabled { background: #e2e8f0; color: #475569; cursor: not-allowed; }
      @media (max-width: 800px) { .top, .paper { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="top">
        <div class="card">
          <h1>Seminar paper sign-up</h1>
          <div class="stats">
            <div class="stat">
              <div class="label">Total papers</div>
              <div class="value" id="total-papers"></div>
            </div>
            <div class="stat">
              <div class="label">Available</div>
              <div class="value" id="available-papers"></div>
            </div>
          </div>
        </div>
        <div class="card">
          <h2>Claim a paper as a pair</h2>
          <div class="field">
            <label for="name1">Full name 1</label>
            <input id="name1" placeholder="Full name 1" />
          </div>
          <div class="field">
            <label for="name2">Full name 2</label>
            <input id="name2" placeholder="Full name 2" />
          </div>
          <div class="field">
            <label for="code">Add code</label>
            <input id="code" type="password" placeholder="" />
          </div>
        </div>
      </div><div id="status" class="card status" style="display:none"></div>
  <div id="schedule"></div>
</div>

<script>
  const SUPABASE_URL = "https://zdizzifeuqzrqxjxasen.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_xhDks_hxq2ouhD2-8WhkIg_SYZfAmSp";

  const PAPERS = [
    { id: "2026-10-28-1", date: "October 28, 2026", number: 1, title: "Edit Distance Cannot Be Computed in Strongly Subquadratic Time (unless SETH is false)", citation: "A. Backurs, P. Indyk. STOC 2015.", link: "https://arxiv.org/abs/1412.0348" },
    { id: "2026-11-04-1", date: "November 4, 2026", number: 2, title: "Fast Approximation Algorithms for the Diameter and Radius of Sparse Graphs", citation: "L. Roditty, V. Vassilevska Williams. STOC 2013.", link: "https://people.csail.mit.edu/virgi/diam.pdf" },
    { id: "2026-11-18-1", date: "November 18, 2026", number: 3, title: "Subcubic Equivalences Between Path, Matrix, and Triangle Problems", citation: "V. Vassilevska Williams, R. Williams. FOCS 2010.", link: "https://people.csail.mit.edu/rrw/tria-mmult.pdf" },
    { id: "2026-11-25-1", date: "November 25, 2026", number: 4, title: "A Simplified Proof of Polynomial Improvements for 3SUM and APSP", citation: "S. R. Karingula, S. Lovett. arXiv 2026.", link: "https://arxiv.org/abs/2610.15663" },
    { id: "2026-11-25-2", date: "November 25, 2026", number: 5, title: "Matrix Multiplication from Polynomial Packings: A Constructive and Elementary Proof of ω ≤ 9/4", citation: "R. Pass. arXiv 2026.", link: "https://arxiv.org/abs/2610.28627" },
    { id: "2026-12-02-1", date: "December 2, 2026", number: 6, title: "On Problems Equivalent to (min,+)-Convolution", citation: "Cygan, Mucha, Wegrzycki, Wlodarczyk. ICALP 2017.", link: "https://arxiv.org/abs/1702.07669" },
    { id: "2026-12-09-1", date: "December 9, 2026", number: 7, title: "Matching Triangles and Basing Hardness on an Extremely Popular Conjecture", citation: "A. Abboud, V. Vassilevska Williams, H. Yu. STOC 2015.", link: "https://people.csail.mit.edu/virgi/MatchTria.pdf" },
    { id: "2026-12-16-1", date: "December 16, 2026", number: 8, title: "Unifying and Strengthening Hardness for Dynamic Problems via the Online Matrix-Vector Multiplication Conjecture", citation: "M. Henzinger, S. Krinninger, D. Nanongkai, T. Saranurak. STOC 2015.", link: "https://arxiv.org/abs/1511.06773" },
    { id: "2026-12-23-1", date: "December 23, 2026", number: 9, title: "Distributed PCP Theorems for Hardness of Approximation in P", citation: "A. Abboud, A. Rubinstein, R. Williams. FOCS 2017.", link: "https://arxiv.org/abs/1706.06407" },
    { id: "2026-12-30-1", date: "December 30, 2026", number: 10, title: "Hardness of Approximate Nearest Neighbor Search", citation: "A. Rubinstein. STOC 2018.", link: "https://arxiv.org/abs/1803.00904" },
    { id: "2027-01-06-1", date: "January 6, 2027", number: 11, title: "Nondeterministic Extensions of the Strong Exponential Time Hypothesis and Consequences for Non-Reducibility", citation: "M. Carmosino, J. Gao, R. Impagliazzo, I. Mihajlin, R. Paturi, S. Schneider. ITCS 2016.", link: "https://eccc.weizmann.ac.il/report/2015/148/" },
  ];
  const DATE_ORDER = [...new Set(PAPERS.map((paper) => paper.date))];
  const PAPER_IDS = new Set(PAPERS.map((paper) => paper.id));
  let claims = [];
  let submittingId = "";

  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  async function fetchClaims() {
    const slotIds = PAPERS.map((paper) => paper.id);
    const response = await fetch(`${SUPABASE_URL}/rest/v1/claims?select=slot_id,student_name,created_at&slot_id=in.(${slotIds.join(",")})`, {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` }
    });
    if (!response.ok) throw new Error("Failed to load claims.");
    return response.json();
  }
  async function insertClaim(slotId, studentName, code) {
    const response = await fetch(`${SUPABASE_URL}/functions/v1/bright-responder`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ slotId, studentName, code })
    });
    if (response.ok) return;
    const data = await response.json().catch(() => ({}));
    throw new Error(data.error || "Could not save claim.");
  }
  function setStatus(text) {
    const el = document.getElementById("status");
    if (!text) { el.style.display = "none"; el.textContent = ""; return; }
    el.style.display = "block";
    el.innerHTML = `<strong>Status:</strong> ${escapeHtml(text)}`;
  }
  function render() {
    document.getElementById("total-papers").textContent = PAPERS.length;
    const claimsBySlot = new Map(claims.filter(c => PAPER_IDS.has(c.slot_id)).map(c => [c.slot_id, c]));
    document.getElementById("available-papers").textContent = PAPERS.length - claimsBySlot.size;
    const schedule = document.getElementById("schedule");
    schedule.innerHTML = "";
    DATE_ORDER.forEach((date) => {
      const papersForDate = PAPERS.filter((paper) => paper.date === date);
      const section = document.createElement("div");
      section.className = "card";
      section.style.marginBottom = "16px";
      section.innerHTML = `<h3>${date}</h3><div class="papers"></div>`;
      const papersEl = section.querySelector(".papers");
      papersForDate.forEach((paper) => {
        const claim = claimsBySlot.get(paper.id);
        const taken = Boolean(claim);
        const disabled = taken || submittingId === paper.id;
        const row = document.createElement("div");
        row.className = "paper";
        row.innerHTML = `<div><div class="badges"><span class="pill">Paper ${paper.number}</span><span class="pill ${taken ? "taken" : "available"}">${taken ? "Taken" : "Available"}</span></div><div class="paper-title">${escapeHtml(paper.title)}</div><div class="citation">${escapeHtml(paper.citation)}</div><div class="linkrow"><a href="${paper.link}" target="_blank" rel="noreferrer">Open paper</a></div><div><strong>Claimed by:</strong> ${claim ? escapeHtml(claim.student_name) : "—"}</div></div><div><button ${disabled ? "disabled" : ""}>${taken ? "Taken" : submittingId === paper.id ? "Claiming..." : "Claim this paper"}</button></div>`;
        const button = row.querySelector("button");
        button.addEventListener("click", async () => {
          const name1 = document.getElementById("name1").value.trim();
          const name2 = document.getElementById("name2").value.trim();
          const code = document.getElementById("code").value.trim();
          if (!name1 || !name2) { setStatus("Enter both full names first."); return; }
          if (!code) { setStatus("Enter the code first."); return; }
          const name = `${name1}; ${name2}`;
          try {
            submittingId = paper.id;
            setStatus("");
            render();
            await insertClaim(paper.id, name, code);
            document.getElementById("name1").value = "";
            document.getElementById("name2").value = "";
            document.getElementById("code").value = "";
            setStatus("Paper claimed.");
            await load();
          } catch (error) {
            setStatus(error.message || "Could not save claim.");
            await load();
          } finally {
            submittingId = "";
            render();
          }
        });
        papersEl.appendChild(row);
      });
      schedule.appendChild(section);
    });
  }
  async function load() {
    try { claims = await fetchClaims(); }
    catch (error) { setStatus(error.message || "Failed to load claims."); }
    render();
  }
  load();
  window.setInterval(load, 10000);
</script>

  </body>
</html>
